<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Only Debug</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    #debugPanel {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 9999;
      width: min(980px, calc(100vw - 24px));
      max-height: 78vh;
      overflow: hidden;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.78);
      color: #00ff90;
      font-size: 14px;
      line-height: 1.45;
      font-family: Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: none;
    }

    #badge {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="stage">
    <video
      id="video"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      controls
    ></video>

    <div id="debugPanel">loading...</div>
    <div id="badge">tv-play-2 / safe-url-debug</div>
  </div>

  <script>
    (function () {
      var VIDEOS = [
        'https://s3.ap-northeast-2.amazonaws.com/onldo/digital_contents/0522_test_1_safe.mp4',
        'https://s3.ap-northeast-2.amazonaws.com/onldo/digital_contents/0522_test_2_safe.mp4',
        'https://s3.ap-northeast-2.amazonaws.com/onldo/digital_contents/0522_test_3_safe.mp4'
      ];

      var videoEl = document.getElementById('video');
      var debugPanel = document.getElementById('debugPanel');

      var currentIndex = 0;
      var loadTimer = null;
      var playTimer = null;
      var statusTimer = null;
      var logs = [];
      var isStoppedOnError = false;

      var LOAD_TIMEOUT = 20000;

      function now() {
        var d = new Date();

        return (
          String(d.getHours()).padStart(2, '0') + ':' +
          String(d.getMinutes()).padStart(2, '0') + ':' +
          String(d.getSeconds()).padStart(2, '0')
        );
      }

      function getErrorCode() {
        try {
          return videoEl.error ? videoEl.error.code : null;
        } catch (e) {
          return null;
        }
      }

      function getVideoState() {
        var duration = 0;

        try {
          duration = Number(videoEl.duration || 0);
        } catch (e) {
          duration = 0;
        }

        return [
          'index=' + (currentIndex + 1) + '/' + VIDEOS.length,
          'readyState=' + videoEl.readyState,
          'networkState=' + videoEl.networkState,
          'paused=' + videoEl.paused,
          'ended=' + videoEl.ended,
          'currentTime=' + Number(videoEl.currentTime || 0).toFixed(1),
          'duration=' + duration.toFixed(1),
          'error=' + getErrorCode()
        ].join(' | ');
      }

      function renderLogs() {
        var currentUrl = VIDEOS[currentIndex] || '';

        debugPanel.textContent =
          'tv-play-2 / safe-url-debug\n' +
          getVideoState() + '\n' +
          'src=' + currentUrl + '\n' +
          'control: Enter=play, →=next, ←=prev, R=reload\n' +
          'stoppedOnError=' + isStoppedOnError + '\n' +
          '--------------------------------------------------\n' +
          logs.slice(-18).join('\n');
      }

      function log(message) {
        logs.push('[' + now() + '] ' + message);
        renderLogs();
      }

      function clearTimers() {
        if (loadTimer) {
          clearTimeout(loadTimer);
          loadTimer = null;
        }

        if (playTimer) {
          clearTimeout(playTimer);
          playTimer = null;
        }
      }

      function resetVideo() {
        clearTimers();

        try {
          videoEl.pause();
        } catch (e) {}

        try {
          videoEl.removeAttribute('src');
          videoEl.load();
        } catch (e) {}
      }

      function setVideoAttributes() {
        videoEl.muted = true;
        videoEl.defaultMuted = true;
        videoEl.autoplay = true;
        videoEl.controls = true;
        videoEl.playsInline = true;
        videoEl.preload = 'auto';

        videoEl.setAttribute('muted', 'true');
        videoEl.setAttribute('autoplay', 'true');
        videoEl.setAttribute('playsinline', 'true');
        videoEl.setAttribute('webkit-playsinline', 'true');
        videoEl.setAttribute('preload', 'auto');
      }

      function playCurrent(reason) {
        isStoppedOnError = false;

        resetVideo();
        setVideoAttributes();

        var rawUrl = VIDEOS[currentIndex];
        var encodedUrl = encodeURI(rawUrl);

        log('LOAD_START reason=' + (reason || 'init'));
        log('URL=' + encodedUrl);

        loadTimer = setTimeout(function () {
          clearTimers();

          isStoppedOnError = true;

          log('LOAD_TIMEOUT after ' + LOAD_TIMEOUT + 'ms');
          log('STOPPED. Press Enter to retry, → for next video.');
          renderLogs();
        }, LOAD_TIMEOUT);

        try {
          videoEl.src = encodedUrl;
          videoEl.load();
          log('video.load() called');
        } catch (e) {
          clearTimers();

          isStoppedOnError = true;

          log('LOAD_THROW ' + String(e && e.message ? e.message : e));
          log('STOPPED. Press Enter to retry, → for next video.');
          renderLogs();
          return;
        }

        playTimer = setTimeout(function () {
          tryPlay('delayed_1000');
        }, 1000);

        renderLogs();
      }

      function tryPlay(reason) {
        if (isStoppedOnError) {
          log('PLAY_SKIPPED stoppedOnError=true');
          return;
        }

        log('PLAY_ATTEMPT reason=' + reason + ' / ' + getVideoState());

        try {
          var promise = videoEl.play();

          if (promise && typeof promise.then === 'function') {
            promise
              .then(function () {
                clearTimers();
                log('PLAY_RESOLVED reason=' + reason + ' / ' + getVideoState());
              })
              .catch(function (error) {
                clearTimers();

                isStoppedOnError = true;

                log(
                  'PLAY_PROMISE_ERROR reason=' + reason +
                  ' message=' + String(error && error.message ? error.message : error)
                );
                log('STOPPED. Press Enter to retry, → for next video.');
                renderLogs();
              });
          } else {
            clearTimers();
            log('PLAY_NO_PROMISE reason=' + reason + ' / ' + getVideoState());
          }
        } catch (e) {
          clearTimers();

          isStoppedOnError = true;

          log(
            'PLAY_THROW reason=' + reason +
            ' message=' + String(e && e.message ? e.message : e)
          );
          log('STOPPED. Press Enter to retry, → for next video.');
          renderLogs();
        }
      }

      function nextVideo(reason) {
        clearTimers();

        currentIndex += 1;

        if (currentIndex >= VIDEOS.length) {
          currentIndex = 0;
        }

        logs = [];
        log('NEXT_VIDEO reason=' + reason);

        playCurrent(reason);
      }

      function prevVideo(reason) {
        clearTimers();

        currentIndex -= 1;

        if (currentIndex < 0) {
          currentIndex = VIDEOS.length - 1;
        }

        logs = [];
        log('PREV_VIDEO reason=' + reason);

        playCurrent(reason);
      }

      function reloadCurrent(reason) {
        clearTimers();

        logs = [];
        log('RELOAD_CURRENT reason=' + reason);

        playCurrent(reason);
      }

      videoEl.onloadedmetadata = function () {
        log('EVENT loadedmetadata / ' + getVideoState());
        tryPlay('loadedmetadata');
      };

      videoEl.onloadeddata = function () {
        log('EVENT loadeddata / ' + getVideoState());
      };

      videoEl.oncanplay = function () {
        log('EVENT canplay / ' + getVideoState());
        tryPlay('canplay');
      };

      videoEl.onplaying = function () {
        clearTimers();
        isStoppedOnError = false;

        log('EVENT playing / ' + getVideoState());
      };

      videoEl.onpause = function () {
        log('EVENT pause / ' + getVideoState());
      };

      videoEl.onwaiting = function () {
        log('EVENT waiting / ' + getVideoState());
      };

      videoEl.onstalled = function () {
        log('EVENT stalled / ' + getVideoState());
      };

      videoEl.onsuspend = function () {
        log('EVENT suspend / ' + getVideoState());
      };

      videoEl.onabort = function () {
        log('EVENT abort / ' + getVideoState());
      };

      videoEl.onemptied = function () {
        log('EVENT emptied / ' + getVideoState());
      };

      videoEl.onerror = function () {
        clearTimers();

        isStoppedOnError = true;

        log('EVENT error code=' + getErrorCode() + ' / ' + getVideoState());
        log('STOPPED. Press Enter to retry, → for next video.');
        renderLogs();
      };

      videoEl.onended = function () {
        log('EVENT ended / ' + getVideoState());

        setTimeout(function () {
          nextVideo('ended');
        }, 1000);
      };

      statusTimer = setInterval(function () {
        renderLogs();
      }, 1000);

      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.keyCode === 39) {
          nextVideo('manual_next');
          return;
        }

        if (e.key === 'ArrowLeft' || e.keyCode === 37) {
          prevVideo('manual_prev');
          return;
        }

        if (e.key === 'Enter' || e.keyCode === 13) {
          isStoppedOnError = false;
          tryPlay('manual_enter');
          return;
        }

        if (e.key === 'r' || e.key === 'R' || e.keyCode === 82) {
          reloadCurrent('manual_reload');
          return;
        }
      });

      window.onerror = function (message, source, lineno, colno, error) {
        log(
          'WINDOW_ERROR message=' + String(message) +
          ' line=' + lineno +
          ' col=' + colno +
          ' error=' + String(error && error.message ? error.message : error)
        );

        return true;
      };

      window.onunhandledrejection = function (event) {
        log(
          'UNHANDLED_REJECTION ' +
          String(event && event.reason && event.reason.message ? event.reason.message : event && event.reason)
        );

        return true;
      };

      log('PAGE_LOADED userAgent=' + navigator.userAgent);
      playCurrent('page_loaded');
    })();
  </script>
</body>
</html>
