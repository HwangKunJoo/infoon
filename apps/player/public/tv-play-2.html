<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Only Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    #debugPanel {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 9999;
      width: min(900px, calc(100vw - 24px));
      max-height: 70vh;
      overflow: hidden;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: #00ff90;
      font-size: 13px;
      line-height: 1.45;
      font-family: Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: none;
    }

    #badge {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="stage">
    <video
      id="video"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      controls
    ></video>

    <div id="debugPanel">loading...</div>
    <div id="badge">tv-play-2 / video-only-debug</div>
  </div>

  <script>
    (function () {
      var VIDEOS = [
        'https://s3.ap-northeast-2.amazonaws.com/onldo/digital_contents/5월2주차_고등_가로 (1)_safe.mp4',
        'https://s3.ap-northeast-2.amazonaws.com/onldo/digital_contents/5월2주차_고등_가로 (3)_safe.mp4',
        'https://s3.ap-northeast-2.amazonaws.com/onldo/digital_contents/5월2주차_고등_가로 (4)_safe.mp4'
      ];

      var videoEl = document.getElementById('video');
      var debugPanel = document.getElementById('debugPanel');

      var currentIndex = 0;
      var loadTimer = null;
      var playTimer = null;
      var heartbeatTimer = null;
      var logs = [];

      var LOAD_TIMEOUT = 20000;

      function now() {
        var d = new Date();

        return (
          String(d.getHours()).padStart(2, '0') + ':' +
          String(d.getMinutes()).padStart(2, '0') + ':' +
          String(d.getSeconds()).padStart(2, '0')
        );
      }

      function getVideoState() {
        var errorCode = null;

        try {
          errorCode = videoEl.error ? videoEl.error.code : null;
        } catch (e) {}

        return [
          'index=' + (currentIndex + 1) + '/' + VIDEOS.length,
          'readyState=' + videoEl.readyState,
          'networkState=' + videoEl.networkState,
          'paused=' + videoEl.paused,
          'ended=' + videoEl.ended,
          'currentTime=' + Number(videoEl.currentTime || 0).toFixed(1),
          'duration=' + Number(videoEl.duration || 0).toFixed(1),
          'error=' + errorCode
        ].join(' | ');
      }

      function renderLogs() {
        var currentUrl = VIDEOS[currentIndex] || '';

        debugPanel.textContent =
          'tv-play-2 / video-only-debug\n' +
          getVideoState() + '\n' +
          'src=' + currentUrl + '\n' +
          '----------------------------------------\n' +
          logs.slice(-30).join('\n');
      }

      function log(message) {
        logs.push('[' + now() + '] ' + message);
        renderLogs();
      }

      function clearTimers() {
        if (loadTimer) {
          clearTimeout(loadTimer);
          loadTimer = null;
        }

        if (playTimer) {
          clearTimeout(playTimer);
          playTimer = null;
        }
      }

      function resetVideo() {
        clearTimers();

        try {
          videoEl.pause();
        } catch (e) {}

        try {
          videoEl.removeAttribute('src');
          videoEl.load();
        } catch (e) {}
      }

      function setVideoAttributes() {
        videoEl.muted = true;
        videoEl.defaultMuted = true;
        videoEl.autoplay = true;
        videoEl.controls = true;
        videoEl.playsInline = true;
        videoEl.preload = 'auto';

        videoEl.setAttribute('muted', 'true');
        videoEl.setAttribute('autoplay', 'true');
        videoEl.setAttribute('playsinline', 'true');
        videoEl.setAttribute('webkit-playsinline', 'true');
        videoEl.setAttribute('preload', 'auto');
      }

      function playCurrent(reason) {
        resetVideo();
        setVideoAttributes();

        var rawUrl = VIDEOS[currentIndex];
        var encodedUrl = encodeURI(rawUrl);

        log('LOAD_START reason=' + (reason || 'init'));
        log('RAW_URL=' + rawUrl);
        log('ENCODED_URL=' + encodedUrl);

        loadTimer = setTimeout(function () {
          log('LOAD_TIMEOUT after ' + LOAD_TIMEOUT + 'ms / ' + getVideoState());
          nextVideo('load_timeout');
        }, LOAD_TIMEOUT);

        try {
          videoEl.src = encodedUrl;
          videoEl.load();
          log('video.load() called');
        } catch (e) {
          log('LOAD_THROW ' + String(e && e.message ? e.message : e));
          nextVideo('load_throw');
          return;
        }

        playTimer = setTimeout(function () {
          tryPlay('delayed_1000');
        }, 1000);

        renderLogs();
      }

      function tryPlay(reason) {
        log('PLAY_ATTEMPT reason=' + reason + ' / ' + getVideoState());

        try {
          var promise = videoEl.play();

          if (promise && typeof promise.then === 'function') {
            promise
              .then(function () {
                clearTimers();
                log('PLAY_RESOLVED reason=' + reason + ' / ' + getVideoState());
              })
              .catch(function (error) {
                log(
                  'PLAY_PROMISE_ERROR reason=' + reason +
                  ' message=' + String(error && error.message ? error.message : error) +
                  ' / ' + getVideoState()
                );

                setTimeout(function () {
                  nextVideo('play_promise_error');
                }, 1000);
              });
          } else {
            clearTimers();
            log('PLAY_NO_PROMISE reason=' + reason + ' / ' + getVideoState());
          }
        } catch (e) {
          log(
            'PLAY_THROW reason=' + reason +
            ' message=' + String(e && e.message ? e.message : e) +
            ' / ' + getVideoState()
          );

          setTimeout(function () {
            nextVideo('play_throw');
          }, 1000);
        }
      }

      function nextVideo(reason) {
        clearTimers();

        log('NEXT_VIDEO reason=' + reason);

        currentIndex += 1;

        if (currentIndex >= VIDEOS.length) {
          currentIndex = 0;
        }

        setTimeout(function () {
          playCurrent(reason);
        }, 500);
      }

      videoEl.onloadedmetadata = function () {
        log('EVENT loadedmetadata / ' + getVideoState());
        tryPlay('loadedmetadata');
      };

      videoEl.onloadeddata = function () {
        log('EVENT loadeddata / ' + getVideoState());
      };

      videoEl.oncanplay = function () {
        log('EVENT canplay / ' + getVideoState());
        tryPlay('canplay');
      };

      videoEl.onplaying = function () {
        clearTimers();
        log('EVENT playing / ' + getVideoState());
      };

      videoEl.onpause = function () {
        log('EVENT pause / ' + getVideoState());
      };

      videoEl.onwaiting = function () {
        log('EVENT waiting / ' + getVideoState());
      };

      videoEl.onstalled = function () {
        log('EVENT stalled / ' + getVideoState());
      };

      videoEl.onsuspend = function () {
        log('EVENT suspend / ' + getVideoState());
      };

      videoEl.onabort = function () {
        log('EVENT abort / ' + getVideoState());
      };

      videoEl.onemptied = function () {
        log('EVENT emptied / ' + getVideoState());
      };

      videoEl.onerror = function () {
        var code = null;

        try {
          code = videoEl.error ? videoEl.error.code : null;
        } catch (e) {}

        log('EVENT error code=' + code + ' / ' + getVideoState());

        setTimeout(function () {
          nextVideo('video_error_' + code);
        }, 1000);
      };

      videoEl.onended = function () {
        log('EVENT ended / ' + getVideoState());
        nextVideo('ended');
      };

      videoEl.ontimeupdate = function () {
        renderLogs();
      };

      heartbeatTimer = setInterval(function () {
        renderLogs();
      }, 1000);

      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.keyCode === 39) {
          nextVideo('manual_next');
        }

        if (e.key === 'Enter' || e.keyCode === 13) {
          tryPlay('manual_enter');
        }
      });

      window.onerror = function (message, source, lineno, colno, error) {
        log(
          'WINDOW_ERROR message=' + String(message) +
          ' line=' + lineno +
          ' col=' + colno +
          ' error=' + String(error && error.message ? error.message : error)
        );

        return true;
      };

      window.onunhandledrejection = function (event) {
        log(
          'UNHANDLED_REJECTION ' +
          String(event && event.reason && event.reason.message ? event.reason.message : event && event.reason)
        );

        return true;
      };

      log('PAGE_LOADED userAgent=' + navigator.userAgent);
      playCurrent('page_loaded');
    })();
  </script>
</body>
</html>
