<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인포온 TV 플레이어</title>

  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="/firebase-logger.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body.landscape,
    body.portrait {
      background: #000;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video,
    img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    video.show,
    img.show {
      opacity: 1;
    }

    body.landscape video,
    body.landscape img,
    body.portrait video,
    body.portrait img {
      object-fit: contain;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: #111;
      color: #fff;
      text-align: center;
      font-size: 34px;
      line-height: 1.4;
    }

    body.portrait .empty {
      font-size: 44px;
      padding: 64px;
    }

    .loading {
      position: absolute;
      right: 24px;
      top: 24px;
      z-index: 20;
      display: none;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: 18px;
    }

    body.portrait .loading {
      right: 32px;
      top: 32px;
      font-size: 24px;
      padding: 16px 22px;
    }
  </style>
</head>

<body>
  <div id="stage">
    <div id="versionBadge" style="
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 9999;
      color: #fff;
      background: rgba(0,0,0,0.55);
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 8px;
      font-family: Arial, Helvetica, sans-serif;
    ">
      Campusmentor-1
    </div>

    <video id="video" autoplay muted playsinline webkit-playsinline preload="auto"></video>
    <img id="image" alt="" />

    <div id="empty" class="empty">
      재생할 콘텐츠가 없습니다.<br />
      관리자 페이지에서 플레이리스트를 연결해주세요.
    </div>

    <div id="loading" class="loading">갱신 중...</div>
  </div>

  <script>
    (function () {
      var API_URL = 'https://info-on.cloud/api-proxy';
      var LOGIN_URL = 'https://info-on.cloud/tv-login.html';

      var PUSHER_KEY = 'a707a1d344893077c43d';
      var PUSHER_CLUSTER = 'ap3';
      var PUSHER_EVENT = 'refresh';

      var PLAYER_VERSION = 'Campusmentor-1';

      var IMAGE_DURATION_SECONDS = 15;
      var SINGLE_VIDEO_REPLAY_LIMIT = 20;

      var HEARTBEAT_INTERVAL = 15000;
      var VIDEO_LOAD_TIMEOUT = 12000;
      var VIDEO_STALL_TIMEOUT = 12000;
      var IMAGE_LOAD_TIMEOUT = 3000;
      var REQUEST_TIMEOUT = 20000;

      var KEYS = {
        TOKEN: 'player_token',
        DEVICE_ID: 'player_device_id',
        ORIENTATION: 'player_orientation'
      };

      var videoEl = document.getElementById('video');
      var imageEl = document.getElementById('image');
      var emptyEl = document.getElementById('empty');
      var loadingEl = document.getElementById('loading');

      var deviceId = getDeviceId();
      var contents = [];
      var currentIndex = 0;
      var imageTimer = null;
      var refreshTimer = null;
      var heartbeatTimer = null;
      var videoLoadTimer = null;
      var videoStallTimer = null;
      var imageLoadTimer = null;
      var pusherInstance = null;
      var currentOrientation = null;
      var isRefreshing = false;
      var singleVideoReplayCount = 0;
      var currentContentUrl = '';
      var currentContentType = '';
      var playSessionId = 0;

      function safeGet(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }

      function safeSet(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      }

      function serializeError(error) {
        if (!error) return 'UNKNOWN_ERROR';
        if (typeof error === 'string') return error;
        if (error.message) return String(error.message);
        try { return JSON.stringify(error); } catch (e) { return String(error); }
      }

      function sendLog(eventType, level, message, payload) {
        try {
          if (typeof window.sendPlayerLog !== 'function') return;

          window.sendPlayerLog({
            deviceId: deviceId || safeGet(KEYS.DEVICE_ID) || 'unknown',
            eventType: eventType,
            level: level || 'info',
            message: message || '',
            url: window.location.href,
            source: 'tv-play-html',
            payload: payload || {}
          });
        } catch (e) {}
      }

      function getQueryParam(name) {
        var query = window.location.search || '';
        var key = name + '=';
        var parts = query.replace('?', '').split('&');

        for (var i = 0; i < parts.length; i++) {
          if (parts[i].indexOf(key) === 0) {
            return decodeURIComponent(parts[i].replace(key, ''));
          }
        }

        return null;
      }

      function isNativeHeartbeatEnabled() {
        return getQueryParam('nativeHeartbeat') === '1';
      }

      function postNativeMessage(data) {
        try {
          if (
            window.ReactNativeWebView &&
            typeof window.ReactNativeWebView.postMessage === 'function'
          ) {
            window.ReactNativeWebView.postMessage(JSON.stringify(data));
          }
        } catch (e) {}
      }

      function buildHeartbeatPayload() {
        return {
          type: 'PLAYER_HEARTBEAT',
          playerVersion: PLAYER_VERSION,
          deviceId: deviceId || 'unknown',
          url: window.location.href,
          currentIndex: currentIndex,
          contentsLength: contents.length,
          currentContentUrl: currentContentUrl,
          currentContentType: currentContentType,
          timestamp: Date.now()
        };
      }

      function startHeartbeat() {
        if (!isNativeHeartbeatEnabled()) {
          sendLog('PLAYER_HEARTBEAT_DISABLED', 'info', 'native heartbeat disabled', {
            nativeHeartbeat: getQueryParam('nativeHeartbeat') || ''
          });
          return;
        }

        if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }

        heartbeatTimer = setInterval(function () {
          postNativeMessage(buildHeartbeatPayload());
        }, HEARTBEAT_INTERVAL);

        postNativeMessage(buildHeartbeatPayload());

        sendLog('PLAYER_HEARTBEAT_ENABLED', 'info', 'native heartbeat enabled');
      }

      function getDeviceId() {
        return getQueryParam('deviceId') || safeGet(KEYS.DEVICE_ID);
      }

      function getToken() {
        return safeGet(KEYS.TOKEN);
      }

      function getOrientation() {
        return window.innerWidth >= window.innerHeight
          ? 'landscape'
          : 'portrait';
      }

      function applyOrientationClass() {
        var orientation = getOrientation();
        currentOrientation = orientation;

        document.body.className = document.body.className
          .replace('landscape', '')
          .replace('portrait', '');

        document.body.className = document.body.className + ' ' + orientation;

        safeSet(KEYS.ORIENTATION, orientation);

        return orientation;
      }

      function showLoading(show) {
        loadingEl.style.display = show ? 'block' : 'none';
      }

      function showEmpty(show) {
        emptyEl.style.display = show ? 'flex' : 'none';
      }

      function showElement(el) {
        if (!el) return;

        el.style.display = 'block';
        el.className = el.className
          .replace(/\bshow\b/g, '')
          .replace(/\s+/g, ' ');

        setTimeout(function () {
          if (el.className.indexOf('show') < 0) {
            el.className = el.className + ' show';
          }
        }, 20);
      }

      function hideElement(el) {
        if (!el) return;

        el.className = el.className
          .replace(/\bshow\b/g, '')
          .replace(/\s+/g, ' ');

        setTimeout(function () {
          if (el.className.indexOf('show') < 0) {
            el.style.display = 'none';
          }
        }, 450);
      }

      function clearTimer(timerName) {
        if (timerName === 'image' && imageTimer) {
          clearTimeout(imageTimer);
          imageTimer = null;
        }

        if (timerName === 'videoLoad' && videoLoadTimer) {
          clearTimeout(videoLoadTimer);
          videoLoadTimer = null;
        }

        if (timerName === 'videoStall' && videoStallTimer) {
          clearTimeout(videoStallTimer);
          videoStallTimer = null;
        }

        if (timerName === 'imageLoad' && imageLoadTimer) {
          clearTimeout(imageLoadTimer);
          imageLoadTimer = null;
        }
      }

      function clearImageSource() {
        try {
          imageEl.removeAttribute('src');
        } catch (e) {}
      }

      function disposeVideoElement(el) {
        if (!el) return;

        try {
          el.pause();
        } catch (e) {}

        try {
          el.removeAttribute('src');
          el.load();
        } catch (e) {}

        try {
          el.onloadedmetadata = null;
          el.oncanplay = null;
          el.onplaying = null;
          el.onloadeddata = null;
          el.onended = null;
          el.onerror = null;
          el.onwaiting = null;
          el.onstalled = null;
          el.onabort = null;
          el.onsuspend = null;
          el.ontimeupdate = null;
        } catch (e) {}

        try {
          if (el.parentNode) {
            el.parentNode.removeChild(el);
          }
        } catch (e) {}
      }

      function createVideoElement() {
        var el = document.createElement('video');

        el.autoplay = true;
        el.muted = true;
        el.defaultMuted = true;
        el.controls = false;
        el.playsInline = true;
        el.preload = 'auto';

        el.setAttribute('autoplay', 'true');
        el.setAttribute('muted', 'true');
        el.setAttribute('playsinline', 'true');
        el.setAttribute('webkit-playsinline', 'true');
        el.setAttribute('preload', 'auto');

        el.style.display = 'block';
        el.style.opacity = '0';
        el.style.zIndex = '2';

        document.getElementById('stage').appendChild(el);

        return el;
      }

      function resetActiveVideoElement() {
        disposeVideoElement(videoEl);
        videoEl = createVideoElement();
      }

      function hidePlayers() {
        playSessionId += 1;

        clearTimer('image');
        clearTimer('videoLoad');
        clearTimer('videoStall');
        clearTimer('imageLoad');

        resetActiveVideoElement();
        hideElement(imageEl);
      }

      function isSingleVideoContent() {
        if (contents.length !== 1) return false;

        var item = contents[0];
        var url = getContentUrl(item);
        var type = getContentType(item, url);

        return type === 'video';
      }

      function withTimeout(promise, ms, label) {
        return new Promise(function (resolve, reject) {
          var done = false;

          var timer = setTimeout(function () {
            if (done) return;
            done = true;
            reject(new Error(label + '_TIMEOUT'));
          }, ms);

          promise
            .then(function (value) {
              if (done) return;
              done = true;
              clearTimeout(timer);
              resolve(value);
            })
            .catch(function (error) {
              if (done) return;
              done = true;
              clearTimeout(timer);
              reject(error);
            });
        });
      }

      function fetchJson(path, token) {
        var headers = {
          'Content-Type': 'application/json'
        };

        if (token) {
          headers['Authorization'] = 'Bearer ' + token;
        }

        return withTimeout(
          fetch(API_URL + path, {
            method: 'GET',
            headers: headers
          }),
          REQUEST_TIMEOUT,
          'FETCH_' + path
        ).then(function (res) {
          return res.text().then(function (text) {
            var data = null;

            try {
              data = text ? JSON.parse(text) : null;
            } catch (e) {
              data = text;
            }

            if (!res.ok) {
              sendLog('PLAYER_API_HTTP_ERROR', 'error', 'HTTP_' + res.status, {
                path: path,
                status: res.status,
                responseText: typeof text === 'string' ? text.slice(0, 500) : ''
              });

              throw new Error('HTTP_' + res.status);
            }

            return data;
          });
        }).catch(function (error) {
          sendLog('PLAYER_API_FETCH_ERROR', 'error', serializeError(error), {
            path: path
          });

          throw error;
        });
      }

      function fetchDevices() {
        return fetchJson('/digital_board/devices', getToken());
      }

      function getDevicesArray(res) {
        if (res && res.data && res.data.length) return res.data;
        if (res && res.devices && res.devices.length) return res.devices;
        if (res && res.data && res.data.data && res.data.data.length) {
          return res.data.data;
        }

        return [];
      }

      function getContentUrl(content) {
        if (!content) return '';

        if (content.file_url) return content.file_url;
        if (content.url) return content.url;
        if (content.path) return content.path;
        if (content.file && content.file.url) return content.file.url;

        if (
          content.file &&
          content.file.data &&
          content.file.data.attributes &&
          content.file.data.attributes.url
        ) {
          return content.file.data.attributes.url;
        }

        if (
          content.attributes &&
          content.attributes.file &&
          content.attributes.file.data &&
          content.attributes.file.data.attributes &&
          content.attributes.file.data.attributes.url
        ) {
          return content.attributes.file.data.attributes.url;
        }

        return '';
      }

      function getContentType(content, url) {
        var rawType =
          (content && content.type) ||
          (content && content.content_type) ||
          (content && content.mime) ||
          '';

        rawType = String(rawType).toLowerCase();
        url = String(url || '').toLowerCase();

        if (rawType.indexOf('video') >= 0 || rawType === 'movie') {
          return 'video';
        }

        if (rawType.indexOf('image') >= 0) {
          return 'image';
        }

        if (
          url.indexOf('.mp4') >= 0 ||
          url.indexOf('.mov') >= 0 ||
          url.indexOf('.webm') >= 0 ||
          url.indexOf('.m4v') >= 0
        ) {
          return 'video';
        }

        if (
          url.indexOf('.jpg') >= 0 ||
          url.indexOf('.jpeg') >= 0 ||
          url.indexOf('.png') >= 0 ||
          url.indexOf('.webp') >= 0 ||
          url.indexOf('.gif') >= 0
        ) {
          return 'image';
        }

        return 'image';
      }

      function extractContents(res) {
        var devices = getDevicesArray(res);

        if (!devices.length || !deviceId) {
          sendLog('PLAYER_DEVICE_NOT_FOUND', 'warn', 'device list empty or deviceId missing', {
            hasDeviceId: !!deviceId,
            devicesLength: devices.length
          });
          return [];
        }

        var matchedDevice = null;

        for (var i = 0; i < devices.length; i++) {
          if (String(devices[i].id) === String(deviceId)) {
            matchedDevice = devices[i];
            break;
          }
        }

        if (!matchedDevice || !matchedDevice.playlists) {
          sendLog('PLAYER_PLAYLIST_NOT_FOUND', 'warn', 'matched device playlist not found', {
            deviceId: deviceId
          });
          return [];
        }

        var result = [];

        for (var p = 0; p < matchedDevice.playlists.length; p++) {
          var playlist = matchedDevice.playlists[p];
          var playlistDuration = Number(playlist.duration || 5);
          var playlistContents = playlist.contents || [];

          for (var c = 0; c < playlistContents.length; c++) {
            var originalItem = playlistContents[c];
            var item = {};

            for (var key in originalItem) {
              item[key] = originalItem[key];
            }

            item.duration = Number(item.duration || playlistDuration || 5);
            result.push(item);
          }
        }

        if (!result.length) {
          sendLog('PLAYER_CONTENTS_EMPTY', 'warn', 'playlist has no contents', {
            deviceId: deviceId
          });
        }

        return result;
      }

      function refreshContents(reason) {
        if (isRefreshing) {
          return;
        }

        playSessionId += 1;
        isRefreshing = true;
        showLoading(true);

        sendLog('PLAYER_REFRESH_START', 'info', 'refresh contents start', {
          reason: reason || 'unknown'
        });

        fetchDevices()
          .then(function (res) {
            var nextContents = extractContents(res);

            contents = nextContents;
            currentIndex = 0;
            singleVideoReplayCount = 0;

            sendLog('PLAYER_REFRESH_SUCCESS', 'info', 'refresh contents success', {
              reason: reason || 'unknown',
              contentsLength: contents.length
            });

            if (!contents.length) {
              hidePlayers();
              showEmpty(true);
              return;
            }

            showEmpty(false);
            playCurrent();
          })
          .catch(function (error) {
            sendLog('PLAYER_REFRESH_ERROR', 'error', serializeError(error), {
              reason: reason || 'unknown'
            });

            if (!contents.length) {
              hidePlayers();
              showEmpty(true);
            }
          })
          .then(function () {
            isRefreshing = false;
            showLoading(false);
          });
      }

      function playCurrent() {
        if (!contents.length) {
          hidePlayers();
          showEmpty(true);
          return;
        }

        if (currentIndex >= contents.length) {
          currentIndex = 0;
        }

        var item = contents[currentIndex];
        var url = getContentUrl(item);
        var type = getContentType(item, url);

        currentContentUrl = url || '';
        currentContentType = type || '';

        if (!url) {
          sendLog('CONTENT_URL_EMPTY', 'warn', 'content url empty', {
            currentIndex: currentIndex,
            item: item
          });

          playNext();
          return;
        }

        if (type === 'video') {
          playVideo(url);
        } else {
          singleVideoReplayCount = 0;
          playImage(url, IMAGE_DURATION_SECONDS);
        }
      }

      function playVideo(url) {
        playSessionId += 1;

        var sessionId = playSessionId;
        var nextVideoEl = createVideoElement();

        clearTimer('image');
        clearTimer('videoLoad');
        clearTimer('videoStall');
        clearTimer('imageLoad');

        var hasStartedPlay = false;
        var isPlayPending = false;
        var hasMovedNext = false;
        var lastCurrentTime = 0;
        var sameTimeCount = 0;

        currentContentUrl = url || '';
        currentContentType = 'video';

        function isCurrentSession() {
          return sessionId === playSessionId;
        }

        function cleanupNextVideo() {
          if (nextVideoEl) {
            disposeVideoElement(nextVideoEl);
            nextVideoEl = null;
          }
        }

        function moveNextOnce(eventType, level, message, payload) {
          if (hasMovedNext) return;

          hasMovedNext = true;

          clearTimer('videoLoad');
          clearTimer('videoStall');

          cleanupNextVideo();

          sendLog(eventType, level, message, payload);
          playNext();
        }

        function switchToNextVideo(reason) {
          if (!isCurrentSession() || hasMovedNext || !nextVideoEl) return;

          hasStartedPlay = true;
          isPlayPending = false;
          sameTimeCount = 0;

          clearTimer('videoLoad');

          var previousVideoEl = videoEl;

          videoEl = nextVideoEl;
          nextVideoEl = null;

          showElement(videoEl);
          hideElement(imageEl);

          setTimeout(function () {
            if (previousVideoEl && previousVideoEl !== videoEl) {
              disposeVideoElement(previousVideoEl);
            }
          }, 550);

          resetStallTimer(reason || 'playing');
        }

        function resetStallTimer(reason) {
          if (!hasStartedPlay || hasMovedNext || !isCurrentSession()) return;

          clearTimer('videoStall');

          videoStallTimer = setTimeout(function () {
            videoStallTimer = null;

            if (!hasStartedPlay || hasMovedNext || !isCurrentSession()) return;

            var currentTime = 0;

            try {
              currentTime = Number(videoEl.currentTime || 0);
            } catch (e) {}

            if (currentTime <= lastCurrentTime + 0.1) {
              sameTimeCount += 1;
            } else {
              sameTimeCount = 0;
            }

            lastCurrentTime = currentTime;

            if (sameTimeCount >= 2) {
              singleVideoReplayCount = 0;

              moveNextOnce('VIDEO_STALL_TIMEOUT', 'warn', 'video stalled too long', {
                url: url,
                reason: reason || '',
                currentTime: currentTime,
                currentIndex: currentIndex,
                readyState: videoEl ? videoEl.readyState : null,
                networkState: videoEl ? videoEl.networkState : null
              });
              return;
            }

            resetStallTimer('stall_recheck');
          }, VIDEO_STALL_TIMEOUT);
        }

        function startPlay(reason) {
          if (
            hasStartedPlay ||
            isPlayPending ||
            hasMovedNext ||
            !isCurrentSession() ||
            !nextVideoEl
          ) {
            return;
          }

          isPlayPending = true;

          sendLog('VIDEO_PLAY_ATTEMPT', 'info', reason || 'play attempt', {
            url: url,
            currentIndex: currentIndex,
            readyState: nextVideoEl ? nextVideoEl.readyState : null,
            networkState: nextVideoEl ? nextVideoEl.networkState : null
          });

          try {
            var playPromise = nextVideoEl.play();

            if (playPromise && typeof playPromise.then === 'function') {
              playPromise
                .then(function () {
                  switchToNextVideo(reason || 'play_resolved');
                })
                .catch(function (error) {
                  isPlayPending = false;

                  if (hasMovedNext || !isCurrentSession()) return;

                  var errorMessage = serializeError(error);

                  if (
                    errorMessage.indexOf('interrupted by a call to pause') >= 0 ||
                    errorMessage.indexOf('interrupted by a new load request') >= 0
                  ) {
                    return;
                  }

                  singleVideoReplayCount = 0;

                  moveNextOnce('VIDEO_PLAY_PROMISE_ERROR', 'warn', errorMessage, {
                    url: url,
                    currentIndex: currentIndex,
                    reason: reason || '',
                    readyState: nextVideoEl ? nextVideoEl.readyState : null,
                    networkState: nextVideoEl ? nextVideoEl.networkState : null
                  });
                });
            } else {
              switchToNextVideo(reason || 'play_no_promise');
            }
          } catch (e) {
            isPlayPending = false;
            singleVideoReplayCount = 0;

            moveNextOnce('VIDEO_PLAY_THROW_ERROR', 'warn', serializeError(e), {
              url: url,
              currentIndex: currentIndex,
              reason: reason || '',
              readyState: nextVideoEl ? nextVideoEl.readyState : null,
              networkState: nextVideoEl ? nextVideoEl.networkState : null
            });
          }
        }

        sendLog('VIDEO_LOAD_START', 'info', 'video load start', {
          url: url,
          currentIndex: currentIndex
        });

        videoLoadTimer = setTimeout(function () {
          videoLoadTimer = null;

          if (!hasStartedPlay && !hasMovedNext && isCurrentSession()) {
            singleVideoReplayCount = 0;

            moveNextOnce('VIDEO_LOAD_TIMEOUT', 'warn', 'video load timeout', {
              url: url,
              currentIndex: currentIndex,
              readyState: nextVideoEl ? nextVideoEl.readyState : null,
              networkState: nextVideoEl ? nextVideoEl.networkState : null
            });
          }
        }, VIDEO_LOAD_TIMEOUT);

        nextVideoEl.onloadedmetadata = function () {
          startPlay('loadedmetadata');
        };

        nextVideoEl.onloadeddata = function () {
          if (hasMovedNext || !isCurrentSession()) return;
          startPlay('loadeddata');
        };

        nextVideoEl.oncanplay = function () {
          startPlay('canplay');
        };

        nextVideoEl.onplaying = function () {
          switchToNextVideo('playing_event');
        };

        nextVideoEl.ontimeupdate = function () {
          if (hasMovedNext || !isCurrentSession()) return;

          if (!hasStartedPlay && nextVideoEl.currentTime > 0) {
            switchToNextVideo('timeupdate');
            return;
          }

          lastCurrentTime = Number((videoEl && videoEl.currentTime) || 0);
        };

        nextVideoEl.onwaiting = function () {
          resetStallTimer('waiting');
        };

        nextVideoEl.onstalled = function () {
          resetStallTimer('stalled');
        };

        nextVideoEl.onabort = function () {};
        nextVideoEl.onsuspend = function () {};

        nextVideoEl.onended = function () {
          if (hasMovedNext || !isCurrentSession()) return;

          clearTimer('videoLoad');
          clearTimer('videoStall');

          if (
            isSingleVideoContent() &&
            singleVideoReplayCount < SINGLE_VIDEO_REPLAY_LIMIT
          ) {
            singleVideoReplayCount += 1;
            playVideo(url);
            return;
          }

          singleVideoReplayCount = 0;
          hasMovedNext = true;
          playNext();
        };

        nextVideoEl.onerror = function () {
          if (hasMovedNext || !isCurrentSession()) return;

          var errorCode = null;

          try {
            errorCode = nextVideoEl.error ? nextVideoEl.error.code : null;
          } catch (e) {}

          singleVideoReplayCount = 0;

          moveNextOnce('VIDEO_ERROR', 'error', 'video element error', {
            url: url,
            errorCode: errorCode,
            currentIndex: currentIndex,
            readyState: nextVideoEl ? nextVideoEl.readyState : null,
            networkState: nextVideoEl ? nextVideoEl.networkState : null
          });
        };

        try {
          nextVideoEl.src = url;
          nextVideoEl.load();
        } catch (e) {
          singleVideoReplayCount = 0;

          moveNextOnce('VIDEO_LOAD_THROW_ERROR', 'error', serializeError(e), {
            url: url,
            currentIndex: currentIndex
          });

          return;
        }

        setTimeout(function () {
          if (!hasMovedNext && !hasStartedPlay && !isPlayPending && isCurrentSession()) {
            startPlay('delayed_start_500');
          }
        }, 500);

        setTimeout(function () {
          if (!hasMovedNext && !hasStartedPlay && !isPlayPending && isCurrentSession()) {
            startPlay('delayed_start_2500');
          }
        }, 2500);
      }

      function preloadImage(url) {
        return new Promise(function (resolve, reject) {
          var img = new Image();

          imageLoadTimer = setTimeout(function () {
            imageLoadTimer = null;
            reject(new Error('IMAGE_LOAD_TIMEOUT'));
          }, IMAGE_LOAD_TIMEOUT);

          img.onload = function () {
            clearTimer('imageLoad');
            resolve(url);
          };

          img.onerror = function () {
            clearTimer('imageLoad');
            reject(new Error('IMAGE_PRELOAD_FAILED'));
          };

          img.src = url;
        });
      }

      function playImage(url, duration) {
        playSessionId += 1;

        var sessionId = playSessionId;
        var previousVideoEl = videoEl;

        clearTimer('image');
        clearTimer('imageLoad');
        clearTimer('videoLoad');
        clearTimer('videoStall');

        preloadImage(url)
          .then(function () {
            if (sessionId !== playSessionId) return;

            currentContentUrl = url || '';
            currentContentType = 'image';

            imageEl.onload = function () {};

            imageEl.onerror = function () {
              if (sessionId !== playSessionId) return;

              sendLog('IMAGE_ELEMENT_ERROR', 'error', 'image element error', {
                url: url,
                currentIndex: currentIndex
              });
              playNext();
            };

            imageEl.src = url;

            showElement(imageEl);

            setTimeout(function () {
              if (sessionId !== playSessionId) return;

              if (previousVideoEl && previousVideoEl !== videoEl) {
                disposeVideoElement(previousVideoEl);
              } else if (previousVideoEl === videoEl) {
                resetActiveVideoElement();
              }
            }, 550);

            imageTimer = setTimeout(function () {
              if (sessionId !== playSessionId) return;
              playNext();
            }, Math.max(1, duration) * 1000);
          })
          .catch(function (error) {
            if (sessionId !== playSessionId) return;

            sendLog('IMAGE_PRELOAD_ERROR', 'error', serializeError(error), {
              url: url,
              currentIndex: currentIndex
            });
            playNext();
          });
      }

      function playNext() {
        if (!contents.length) return;

        currentIndex = currentIndex + 1;

        if (currentIndex >= contents.length) {
          currentIndex = 0;
        }

        playCurrent();
      }

      function initPusher() {
        if (!deviceId) return;

        try {
          pusherInstance = new Pusher(PUSHER_KEY, {
            cluster: PUSHER_CLUSTER
          });

          var channelName = 'tv-control-' + deviceId;
          var channel = pusherInstance.subscribe(channelName);

          channel.bind(PUSHER_EVENT, function () {
            sendLog('PUSHER_REFRESH_RECEIVED', 'info', 'pusher refresh received', {
              channelName: channelName
            });
            refreshContents('pusher');
          });

          pusherInstance.connection.bind('connected', function () {
            sendLog('PUSHER_CONNECTED', 'info', 'pusher connected', {
              channelName: channelName
            });
          });

          pusherInstance.connection.bind('disconnected', function () {
            sendLog('PUSHER_DISCONNECTED', 'warn', 'pusher disconnected', {
              channelName: channelName
            });

            try {
              pusherInstance.disconnect();
            } catch (e) {}

            pusherInstance = null;

            setTimeout(function () {
              initPusher();
            }, 3000);
          });

          pusherInstance.connection.bind('error', function (error) {
            sendLog('PUSHER_ERROR', 'warn', serializeError(error), {
              channelName: channelName
            });
          });
        } catch (e) {
          sendLog('PUSHER_INIT_ERROR', 'error', serializeError(e));

          setTimeout(function () {
            initPusher();
          }, 3000);
        }
      }

      function initKeyEvents() {
        document.addEventListener('keydown', function (e) {
          if (e.keyCode === 10009) {
            e.preventDefault();
            return false;
          }
        });
      }

      function redirectToLogin() {
        try {
          window.location.replace(LOGIN_URL);
        } catch (e) {
          window.location.href = LOGIN_URL;
        }
      }

      function init() {
        applyOrientationClass();
        initKeyEvents();
        startHeartbeat();

        sendLog('PLAYER_VERSION', 'info', PLAYER_VERSION, {
          playerVersion: PLAYER_VERSION
        });

        sendLog('PLAYER_PAGE_LOADED', 'info', 'tv-play page loaded', {
          playerVersion: PLAYER_VERSION,
          userAgent: navigator.userAgent || '',
          orientation: getOrientation(),
          href: window.location.href,
          deviceId: deviceId || '',
          nativeHeartbeat: getQueryParam('nativeHeartbeat') || ''
        });

        if (!deviceId) {
          sendLog('PLAYER_DEVICE_ID_MISSING', 'error', 'deviceId missing. redirect to login');

          setTimeout(function () {
            redirectToLogin();
          }, 500);

          return;
        }

        safeSet(KEYS.DEVICE_ID, deviceId);

        refreshContents('init');
        initPusher();
      }

      window.addEventListener('resize', function () {
        applyOrientationClass();
      });

      window.addEventListener('online', function () {
        sendLog('PLAYER_NETWORK_ONLINE', 'info', 'browser online event');
        refreshContents('online');
      });

      window.addEventListener('offline', function () {
        sendLog('PLAYER_NETWORK_OFFLINE', 'warn', 'browser offline event');
      });

      window.onerror = function (message, source, lineno, colno, error) {
        sendLog('PLAYER_WINDOW_ERROR', 'error', serializeError(error || message), {
          message: message,
          source: source,
          lineno: lineno,
          colno: colno
        });

        return true;
      };

      window.onunhandledrejection = function (event) {
        sendLog('PLAYER_UNHANDLED_REJECTION', 'error', serializeError(event && event.reason), {});
        return true;
      };

      window.onbeforeunload = function () {
        if (refreshTimer) {
          clearInterval(refreshTimer);
        }

        if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
        }

        clearTimer('image');
        clearTimer('videoLoad');
        clearTimer('videoStall');
        clearTimer('imageLoad');

        disposeVideoElement(videoEl);

        try {
          if (pusherInstance) {
            pusherInstance.disconnect();
          }
        } catch (e) {}
      };

      setTimeout(function () {
        var badge = document.getElementById('versionBadge');
        if (badge) {
          badge.style.display = 'none';
        }
      }, 5000);

      init();
    })();
  </script>
</body>
</html>
