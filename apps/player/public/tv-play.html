<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인포온 TV 플레이어</title>

  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body.landscape {
      background: #000;
    }

    body.portrait {
      background: #000;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video,
    img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    video.show,
    img.show {
      opacity: 1;
    }

    body.landscape video,
    body.landscape img {
      object-fit: contain;
    }

    body.portrait video,
    body.portrait img {
      object-fit: cover;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: #111;
      color: #fff;
      text-align: center;
      font-size: 34px;
      line-height: 1.4;
    }

    body.portrait .empty {
      font-size: 44px;
      padding: 64px;
    }

    .loading {
      position: absolute;
      right: 24px;
      top: 24px;
      z-index: 20;
      display: none;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: 18px;
    }

    body.portrait .loading {
      right: 32px;
      top: 32px;
      font-size: 24px;
      padding: 16px 22px;
    }

    .overlay {
      position: absolute;
      z-index: 18;
      color: #fff;
      display: none;
      pointer-events: none;
    }

    body.landscape .overlay {
      display: none;
    }

    body.portrait .overlay {
      display: block;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 80px 56px 56px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0));
    }

    .overlay-title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.25;
    }

    .overlay-sub {
      margin-top: 12px;
      font-size: 28px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.76);
    }
  </style>
</head>

<body>
  <div id="stage">
    <video id="video" autoplay muted playsinline webkit-playsinline></video>
    <img id="image" alt="" />

    <div id="empty" class="empty">
      재생할 콘텐츠가 없습니다.<br />
      관리자 페이지에서 플레이리스트를 연결해주세요.
    </div>

    <div id="loading" class="loading">갱신 중...</div>

    <div id="overlay" class="overlay">
      <div id="overlayTitle" class="overlay-title"></div>
      <div id="overlaySub" class="overlay-sub"></div>
    </div>
  </div>

  <script>
    (function () {
      var API_URL = 'https://www.info-on.cloud/api-proxy';

      var PUSHER_KEY = 'a707a1d344893077c43d';
      var PUSHER_CLUSTER = 'ap3';
      var PUSHER_EVENT = 'refresh';

      var SINGLE_VIDEO_REPLAY_LIMIT = 20;

      var KEYS = {
        TOKEN: 'player_token',
        DEVICE_ID: 'player_device_id',
        ORIENTATION: 'player_orientation'
      };

      var videoEl = document.getElementById('video');
      var imageEl = document.getElementById('image');
      var emptyEl = document.getElementById('empty');
      var loadingEl = document.getElementById('loading');
      var overlayTitleEl = document.getElementById('overlayTitle');
      var overlaySubEl = document.getElementById('overlaySub');

      var deviceId = getDeviceId();
      var contents = [];
      var currentIndex = 0;
      var imageTimer = null;
      var refreshTimer = null;
      var pusherInstance = null;
      var currentOrientation = null;
      var isRefreshing = false;
      var singleVideoReplayCount = 0;

      function safeGet(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }

      function safeSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {}
      }

      function getQueryParam(name) {
        var query = window.location.search || '';
        var key = name + '=';
        var parts = query.replace('?', '').split('&');

        for (var i = 0; i < parts.length; i++) {
          if (parts[i].indexOf(key) === 0) {
            return decodeURIComponent(parts[i].replace(key, ''));
          }
        }

        return null;
      }

      function getDeviceId() {
        return getQueryParam('deviceId') || safeGet(KEYS.DEVICE_ID);
      }

      function getToken() {
        return safeGet(KEYS.TOKEN);
      }

      function getOrientation() {
        var queryOrientation = getQueryParam('orientation');

        if (queryOrientation === 'landscape' || queryOrientation === 'portrait') {
          return queryOrientation;
        }

        return window.innerWidth >= window.innerHeight ? 'landscape' : 'portrait';
      }

      function applyOrientationClass() {
        var orientation = getOrientation();
        currentOrientation = orientation;

        document.body.className = document.body.className
          .replace('landscape', '')
          .replace('portrait', '');

        document.body.className = document.body.className + ' ' + orientation;
        safeSet(KEYS.ORIENTATION, orientation);

        return orientation;
      }

      function showLoading(show) {
        loadingEl.style.display = show ? 'block' : 'none';
      }

      function showEmpty(show) {
        emptyEl.style.display = show ? 'flex' : 'none';
      }

      function showElement(el) {
        if (!el) return;

        el.style.display = 'block';
        el.className = el.className.replace(/\bshow\b/g, '').replace(/\s+/g, ' ');

        setTimeout(function () {
          if (el.className.indexOf('show') < 0) {
            el.className = el.className + ' show';
          }
        }, 20);
      }

      function hideElement(el) {
        if (!el) return;

        el.className = el.className.replace(/\bshow\b/g, '').replace(/\s+/g, ' ');

        setTimeout(function () {
          if (el.className.indexOf('show') < 0) {
            el.style.display = 'none';
          }
        }, 450);
      }

      function clearImageSource() {
        try {
          imageEl.removeAttribute('src');
        } catch (e) {}
      }

      function hidePlayers() {
        if (imageTimer) {
          clearTimeout(imageTimer);
          imageTimer = null;
        }

        try {
          videoEl.pause();
        } catch (e) {}

        hideElement(videoEl);
        hideElement(imageEl);
      }

      function isSingleVideoContent() {
        if (contents.length !== 1) {
          return false;
        }

        var item = contents[0];
        var url = getContentUrl(item);
        var type = getContentType(item, url);

        return type === 'video';
      }

      function fetchJson(path, token) {
        var headers = {
          'Content-Type': 'application/json'
        };

        if (token) {
          headers['Authorization'] = 'Bearer ' + token;
        }

        return fetch(API_URL + path, {
          method: 'GET',
          headers: headers
        }).then(function (res) {
          return res.text().then(function (text) {
            var data = null;

            try {
              data = text ? JSON.parse(text) : null;
            } catch (e) {
              data = text;
            }

            if (!res.ok) {
              throw new Error('HTTP_' + res.status);
            }

            return data;
          });
        });
      }

      function fetchDevices() {
        return fetchJson('/digital_board/devices', getToken());
      }

      function getDevicesArray(res) {
        if (res && res.data && res.data.length) return res.data;
        if (res && res.devices && res.devices.length) return res.devices;
        if (res && res.data && res.data.data && res.data.data.length) return res.data.data;
        return [];
      }

      function getContentUrl(content) {
        if (!content) return '';

        if (content.file_url) return content.file_url;
        if (content.url) return content.url;
        if (content.path) return content.path;

        if (content.file && content.file.url) return content.file.url;

        if (
          content.file &&
          content.file.data &&
          content.file.data.attributes &&
          content.file.data.attributes.url
        ) {
          return content.file.data.attributes.url;
        }

        if (
          content.attributes &&
          content.attributes.file &&
          content.attributes.file.data &&
          content.attributes.file.data.attributes &&
          content.attributes.file.data.attributes.url
        ) {
          return content.attributes.file.data.attributes.url;
        }

        return '';
      }

      function getContentType(content, url) {
        var rawType =
          (content && content.type) ||
          (content && content.content_type) ||
          (content && content.mime) ||
          '';

        rawType = String(rawType).toLowerCase();
        url = String(url || '').toLowerCase();

        if (rawType.indexOf('video') >= 0 || rawType === 'movie') return 'video';
        if (rawType.indexOf('image') >= 0) return 'image';

        if (
          url.indexOf('.mp4') >= 0 ||
          url.indexOf('.mov') >= 0 ||
          url.indexOf('.webm') >= 0 ||
          url.indexOf('.m4v') >= 0
        ) {
          return 'video';
        }

        if (
          url.indexOf('.jpg') >= 0 ||
          url.indexOf('.jpeg') >= 0 ||
          url.indexOf('.png') >= 0 ||
          url.indexOf('.webp') >= 0 ||
          url.indexOf('.gif') >= 0
        ) {
          return 'image';
        }

        return 'image';
      }

      function getContentText(content, key) {
        if (!content) return '';

        if (content[key]) return content[key];

        if (content.attributes && content.attributes[key]) {
          return content.attributes[key];
        }

        return '';
      }

      function updateOverlay(item) {
        var title =
          getContentText(item, 'title') ||
          getContentText(item, 'name') ||
          '';

        var sub =
          getContentText(item, 'description') ||
          getContentText(item, 'desc') ||
          '';

        overlayTitleEl.textContent = title;
        overlaySubEl.textContent = sub;
      }

      function extractContents(res) {
        var devices = getDevicesArray(res);

        if (!devices.length || !deviceId) {
          return [];
        }

        var matchedDevice = null;

        for (var i = 0; i < devices.length; i++) {
          if (String(devices[i].id) === String(deviceId)) {
            matchedDevice = devices[i];
            break;
          }
        }

        if (!matchedDevice || !matchedDevice.playlists) {
          return [];
        }

        var result = [];

        for (var p = 0; p < matchedDevice.playlists.length; p++) {
          var playlist = matchedDevice.playlists[p];
          var playlistDuration = Number(playlist.duration || 5);
          var playlistContents = playlist.contents || [];

          for (var c = 0; c < playlistContents.length; c++) {
            var originalItem = playlistContents[c];
            var item = {};

            for (var key in originalItem) {
              item[key] = originalItem[key];
            }

            item.duration = Number(item.duration || playlistDuration || 5);
            result.push(item);
          }
        }

        return result;
      }

      function refreshContents(reason) {
        if (isRefreshing) {
          return;
        }

        isRefreshing = true;
        showLoading(true);

        fetchDevices()
          .then(function (res) {
            var nextContents = extractContents(res);

            contents = nextContents;
            currentIndex = 0;
            singleVideoReplayCount = 0;

            if (!contents.length) {
              hidePlayers();
              updateOverlay(null);
              showEmpty(true);
              return;
            }

            showEmpty(false);
            playCurrent();
          })
          .catch(function () {
            if (!contents.length) {
              hidePlayers();
              updateOverlay(null);
              showEmpty(true);
            }
          })
          .then(function () {
            isRefreshing = false;
            showLoading(false);
          });
      }

      function playCurrent() {
        if (!contents.length) {
          hidePlayers();
          updateOverlay(null);
          showEmpty(true);
          return;
        }

        if (currentIndex >= contents.length) {
          currentIndex = 0;
        }

        var item = contents[currentIndex];
        var url = getContentUrl(item);
        var type = getContentType(item, url);

        updateOverlay(item);

        if (!url) {
          playNext();
          return;
        }

        if (type === 'video') {
          playVideo(url);
        } else {
          singleVideoReplayCount = 0;
          playImage(url, Number(item.duration || 5));
        }
      }

      function playVideo(url) {
        if (imageTimer) {
          clearTimeout(imageTimer);
          imageTimer = null;
        }

        clearImageSource();
        hideElement(imageEl);

        videoEl.onloadedmetadata = null;
        videoEl.oncanplay = null;
        videoEl.onplaying = null;
        videoEl.onloadeddata = null;
        videoEl.onended = null;
        videoEl.onerror = null;

        videoEl.className = videoEl.className.replace('show', '');
        videoEl.style.display = 'block';

        videoEl.muted = true;
        videoEl.autoplay = true;
        videoEl.controls = false;
        videoEl.playsInline = true;
        videoEl.setAttribute('playsinline', 'true');
        videoEl.setAttribute('webkit-playsinline', 'true');

        videoEl.src = url;

        var hasStartedPlay = false;

        function startPlay() {
          if (hasStartedPlay) {
            return;
          }

          hasStartedPlay = true;
          showElement(videoEl);

          try {
            var playPromise = videoEl.play();

            if (playPromise && typeof playPromise.then === 'function') {
              playPromise
                .then(function () {
                  showElement(videoEl);
                })
                .catch(function () {});
            }
          } catch (e) {}
        }

        videoEl.onloadedmetadata = function () {
          startPlay();
        };

        videoEl.onloadeddata = function () {
          showElement(videoEl);
        };

        videoEl.oncanplay = function () {
          startPlay();
        };

        videoEl.onplaying = function () {
          showElement(videoEl);
        };

        videoEl.onended = function () {
          if (
            isSingleVideoContent() &&
            singleVideoReplayCount < SINGLE_VIDEO_REPLAY_LIMIT
          ) {
            singleVideoReplayCount += 1;

            try {
              videoEl.currentTime = 0;

              var replayPromise = videoEl.play();

              if (replayPromise && typeof replayPromise.then === 'function') {
                replayPromise.catch(function () {});
              }
            } catch (e) {
              singleVideoReplayCount = 0;
              playNext();
            }

            return;
          }

          singleVideoReplayCount = 0;
          playNext();
        };

        videoEl.onerror = function () {
          singleVideoReplayCount = 0;
          playNext();
        };

        try {
          videoEl.load();
        } catch (e) {
          singleVideoReplayCount = 0;
          playNext();
        }

        setTimeout(function () {
          if (videoEl.paused) {
            startPlay();
          } else {
            showElement(videoEl);
          }
        }, 2000);
      }

      function preloadImage(url) {
        return new Promise(function (resolve, reject) {
          var img = new Image();

          img.onload = function () {
            resolve(url);
          };

          img.onerror = function () {
            reject(new Error('IMAGE_PRELOAD_FAILED'));
          };

          img.src = url;
        });
      }

      function playImage(url, duration) {
        if (imageTimer) {
          clearTimeout(imageTimer);
          imageTimer = null;
        }

        try {
          videoEl.pause();
        } catch (e) {}

        hideElement(videoEl);

        preloadImage(url)
          .then(function () {
            imageEl.onload = function () {};
            imageEl.onerror = function () {
              playNext();
            };

            imageEl.src = url;
            showElement(imageEl);

            imageTimer = setTimeout(function () {
              playNext();
            }, Math.max(1, duration) * 1000);
          })
          .catch(function () {
            playNext();
          });
      }

      function playNext() {
        if (!contents.length) return;

        currentIndex = currentIndex + 1;

        if (currentIndex >= contents.length) {
          currentIndex = 0;
        }

        playCurrent();
      }

      function initPusher() {
        if (!deviceId) return;

        try {
          pusherInstance = new Pusher(PUSHER_KEY, {
            cluster: PUSHER_CLUSTER
          });

          var channelName = 'tv-control-' + deviceId;
          var channel = pusherInstance.subscribe(channelName);

          channel.bind(PUSHER_EVENT, function () {
            refreshContents('pusher');
          });

          pusherInstance.connection.bind('disconnected', function () {
            try {
              pusherInstance.disconnect();
            } catch (e) {}

            pusherInstance = null;

            setTimeout(function () {
              initPusher();
            }, 3000);
          });

          pusherInstance.connection.bind('error', function () {});
        } catch (e) {
          setTimeout(function () {
            initPusher();
          }, 3000);
        }
      }

      function initKeyEvents() {
        document.addEventListener('keydown', function (e) {
          if (e.keyCode === 10009) {
            e.preventDefault();
            return false;
          }
        });
      }

      function init() {
        applyOrientationClass();
        initKeyEvents();

        if (!deviceId) {
          setTimeout(function () {
            try {
              window.location.replace('https://www.info-on.cloud/tv-login.html');
            } catch (e) {
              window.location.href = 'https://www.info-on.cloud/tv-login.html';
            }
          }, 500);

          return;
        }

        safeSet(KEYS.DEVICE_ID, deviceId);

        refreshContents('init');
        initPusher();

        refreshTimer = setInterval(function () {
          refreshContents('interval');
        }, 60000);
      }

      window.addEventListener('resize', function () {
        applyOrientationClass();
      });

      window.onerror = function () {
        return true;
      };

      window.onbeforeunload = function () {
        if (refreshTimer) {
          clearInterval(refreshTimer);
        }

        if (imageTimer) {
          clearTimeout(imageTimer);
        }

        try {
          if (pusherInstance) {
            pusherInstance.disconnect();
          }
        } catch (e) {}
      };

      init();
    })();
  </script>
</body>
</html>
